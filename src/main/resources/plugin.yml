name: Juggernaut
version: '${version}'
main: dev.juggernaut.JuggernautPlugin
api-version: '26.2'
description: One player is the Juggernaut. They glow through walls and everyone can track them until they die.
commands:
  juggernaut:
    description: Manage the Juggernaut
    usage: /juggernaut <set <player>|clear|info>
    aliases: [jug]
    permission: juggernaut.admin
  track:
    description: Get a Juggernaut tracking compass
    usage: /track
    permission: juggernaut.track
permissions:
  juggernaut.admin:
    default: op
  juggernaut.track:
    default: true
